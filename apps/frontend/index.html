<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>EndlessBacklog — free, self-hosted Kanban boards</title>
    <meta
      name="description"
      content="EndlessBacklog is a free, self-hosted Trello alternative and agile planning board — boards, lists, cards, checklists, and real-time collaboration, without workspace or seat limits."
    />
    <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#22c55e" media="(prefers-color-scheme: dark)" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/png/favicon-32.png" />
    <link rel="alternate icon" type="image/png" sizes="16x16" href="/png/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/png/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EndlessBacklog" />
    <meta property="og:title" content="EndlessBacklog — free, self-hosted Kanban boards" />
    <meta
      property="og:description"
      content="A free, self-hosted Trello alternative and agile planning board. Boards, lists, cards, checklists, and real-time collaboration — no workspace or seat limits."
    />
    <meta property="og:image" content="/png/logo-mark-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EndlessBacklog — free, self-hosted Kanban boards" />
    <meta
      name="twitter:description"
      content="A free, self-hosted Trello alternative and agile planning board. Boards, lists, cards, checklists, and real-time collaboration — no workspace or seat limits."
    />
    <meta name="twitter:image" content="/png/logo-mark-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
